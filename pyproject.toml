[project]
name = "house-prices"
version = "0.1.0"
description = "Learning data-engineering pipeline over a synthetic Polish housing market."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# PTH enforces pathlib and DTZ timezone-aware datetimes (both project rules in CLAUDE.md).
select = ["E", "F", "W", "I", "UP", "B", "PTH", "DTZ"]

[tool.ruff.format]
line-ending = "lf"
# Ruff would otherwise reformat code blocks inside docs, including docs/spec.md.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
